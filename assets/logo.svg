<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Minute by Minute: an open book with a clock rising from its spine. SPDX-License-Identifier: MIT -->
  <rect width="24" height="24" rx="4" fill="#111"/>
  <!-- the pages -->
  <path fill="#fff" d="M2.8 10.6 C5.6 9.6 8.9 9.7 11.6 11.2 V20.4 C8.9 19 5.6 18.9 2.8 19.9 Z"/>
  <path fill="#fff" d="M21.2 10.6 C18.4 9.6 15.1 9.7 12.4 11.2 V20.4 C15.1 19 18.4 18.9 21.2 19.9 Z"/>
  <!-- lines of text -->
  <g stroke="#111" stroke-width="0.9" stroke-linecap="round">
    <path d="M4.6 14.9 C6.4 14.4 8.2 14.5 9.9 15.2"/>
    <path d="M4.6 17.2 C6.4 16.7 8.2 16.8 9.9 17.5"/>
    <path d="M19.4 14.9 C17.6 14.4 15.8 14.5 14.1 15.2"/>
    <path d="M19.4 17.2 C17.6 16.7 15.8 16.8 14.1 17.5"/>
  </g>
  <!-- the clock, set apart from the pages by a dark ring -->
  <circle cx="12" cy="7.9" r="5.2" fill="#fff" stroke="#111" stroke-width="1.6"/>
  <g stroke="#111" stroke-width="1.3" stroke-linecap="round">
    <line x1="12" y1="7.9" x2="12" y2="4.6"/>
    <line x1="12" y1="7.9" x2="14.3" y2="9.2"/>
  </g>
  <circle cx="12" cy="7.9" r="0.8" fill="#111"/>
</svg>

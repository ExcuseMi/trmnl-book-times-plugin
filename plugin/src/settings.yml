---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version:
serverless_language:
refresh_interval_floor:
polling_url: 'https://excusemi.github.io/trmnl-minute-by-minute-plugin/m/{{ "now" | date: "%s" | plus: trmnl.user.utc_offset | date: "%H%M" }}.json'
polling_headers: ''
polling_body: ''
id: 487888
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: author_info
  name: About Minute by Minute
  field_type: author_bio
  description: "<strong>A literary clock.</strong> Every time your screen refreshes it shows a passage from a book that names that very minute, set as a typographic poster: the words that tell the time large and black, the story around them sized so every line runs edge to edge, the book, its author and the time in the title bar.<br /><br />A passage for each of the 1440 minutes of the day, nearly all with a real time phrase (&quot;twenty minutes past seven&quot;), and where possible one that fits the half of the day, so evenings get evening scenes. The quotes come from public-domain books on <a href='https://www.gutenberg.org' target='_blank'>Project Gutenberg</a> and the literature-clock collections of <a href='https://github.com/JohsEnevoldsen/literature-clock' target='_blank'>JohsEnevoldsen</a> (CC BY-NC-SA 2.5), <a href='https://github.com/cdmoro/literature-clock' target='_blank'>cdmoro</a> and <a href='https://github.com/utrost/LiteratureClock' target='_blank'>utrost</a> (AGPL-3.0).<br /><br />TRMNL redraws a screen every few minutes, so the time in the title bar says which minute the passage is for."
  github_url: https://github.com/ExcuseMi/trmnl-minute-by-minute-plugin
  learn_more_url: https://github.com/ExcuseMi/trmnl-minute-by-minute-plugin#readme
  category: life
  help_text: TRMNL X Ready
- keyname: show_time
  field_type: boolean
  name: Show the Time
  description: The time the passage names, in digits in the title bar.
  default: true
  optional: true
- keyname: hour_format
  field_type: select
  name: Hour Format
  description: How the time in the corner reads.
  options:
  - 24-hour (13:05): '24'
  - 12-hour (1:05 PM): '12'
  default: '24'
  optional: true
- keyname: show_attribution
  field_type: boolean
  name: Show Title and Author
  description: 'The book and its author in the title bar. Keep it on: the passages are quoted with credit (Project Gutenberg, <a href=''https://github.com/JohsEnevoldsen/literature-clock'' target=''_blank''>JohsEnevoldsen</a>, <a href=''https://github.com/cdmoro/literature-clock'' target=''_blank''>cdmoro</a>, <a href=''https://github.com/utrost/LiteratureClock'' target=''_blank''>utrost</a>).'
  default: true
  optional: true
name: Minute by Minute
description: 'The current time, told by a passage from a book: a new literary quote for every minute of the day.'
refresh_interval: 15
